# API / SaaS profile. Enable with SPRING_PROFILES_ACTIVE=api
# (optionally comma-separated with development). Does not send mail on boot.

mail.batch-enabled=false
mail.dry-run=true
mail.test-send-enabled=false

# Replace CLI auto-config exclusions so DataSource / JPA / Flyway / Security load.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:excelmail}
spring.datasource.username=${DB_USERNAME:excelmail}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

excelmail.security.jwt-secret=${APP_JWT_SECRET:}
excelmail.security.jwt-expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
excelmail.crypto.key=${APP_ENCRYPTION_KEY:}
excelmail.auth.rate-limit-per-minute=${APP_AUTH_RATE_LIMIT:30}
excelmail.worker.enabled=${EXCELMAIL_WORKER_ENABLED:true}

spring.servlet.multipart.max-file-size=${EXCELMAIL_MAX_UPLOAD:5MB}
spring.servlet.multipart.max-request-size=${EXCELMAIL_MAX_UPLOAD:5MB}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.info.env.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
