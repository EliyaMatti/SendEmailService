# Test-only overrides for the api profile. Never used in production.
spring.datasource.url=jdbc:h2:mem:excelmail;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
excelmail.worker.enabled=false
excelmail.security.jwt-secret=unit-test-jwt-secret-key-must-be-long-enough
excelmail.crypto.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
mail.batch-enabled=false
mail.dry-run=true
mail.test-send-enabled=false
