# Profile: production. Activate with SPRING_PROFILES_ACTIVE=production
# or --spring.profiles.active=production.
#
# Do not put SMTP passwords, App Passwords, or real usernames in this file.
# Set MAIL_USERNAME, MAIL_PASSWORD, and MAIL_FROM (or SMTP_* aliases) in the
# runtime environment or a gitignored local file.

logging.level.root=WARN
logging.level.com.mailSender=INFO
logging.level.com.mailSender.smtp=INFO

# Sending stays env-driven. Defaults remain batch off and dry-run on so a
# misconfigured deploy does not send mail until MAIL_BATCH_ENABLED=true and
# MAIL_DRY_RUN=false are set together.
mail.batch-enabled=${MAIL_BATCH_ENABLED:false}
mail.dry-run=${MAIL_DRY_RUN:true}
mail.test-send-enabled=${MAIL_TEST_SEND_ENABLED:false}
