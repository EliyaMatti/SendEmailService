spring.application.name=MailSender
spring.config.import=optional:classpath:application-local.properties

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mail.from=${MAIL_FROM:${spring.mail.username}}
mail.subject=${MAIL_SUBJECT:Java developer Application – Eliya}
mail.excel-file-path=${MAIL_EXCEL_FILE_PATH:}
mail.body-file-path=${MAIL_BODY_FILE_PATH:}
mail.attachment-path=${MAIL_ATTACHMENT_PATH:}
mail.batch-enabled=${MAIL_BATCH_ENABLED:true}
