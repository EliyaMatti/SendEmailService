# API / SaaS profile. Enable with SPRING_PROFILES_ACTIVE=api
# (optionally comma-separated with development). Does not send mail on boot.

mail.batch-enabled=false
mail.dry-run=true
mail.test-send-enabled=false

# Replace CLI auto-config exclusions so DataSource / JPA / Flyway load.
# Keep the default UserDetailsService off; JWT security is added in Phase 5.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:excelmail}
spring.datasource.username=${DB_USERNAME:excelmail}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
