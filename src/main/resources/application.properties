spring.application.name=MailSender
spring.profiles.default=development
spring.config.import=optional:classpath:application-local.properties

# SMTP (JavaMailSender). Credentials from env / gitignored local properties only.
spring.mail.host=${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Envelope
mail.from=${MAIL_FROM:${SMTP_FROM_EMAIL:${spring.mail.username}}}
mail.from-name=${MAIL_FROM_NAME:}
mail.subject=${MAIL_SUBJECT:Java developer Application – Eliya}

# Input files
mail.excel-file-path=${MAIL_EXCEL_FILE_PATH:}
mail.body-file-path=${MAIL_BODY_FILE_PATH:}
mail.attachment-path=${MAIL_ATTACHMENT_PATH:}
mail.sent-log-path=${MAIL_SENT_LOG_PATH:sent-addresses.txt}

# Sending (delay is mail.send-delay-ms — never a hardcoded Thread.sleep(60000))
mail.batch-enabled=${MAIL_BATCH_ENABLED:false}
mail.dry-run=${MAIL_DRY_RUN:true}
mail.html=${MAIL_HTML:false}
mail.send-delay-ms=${MAIL_SEND_DELAY_MS:1000}
mail.test-send-enabled=${MAIL_TEST_SEND_ENABLED:false}
mail.test-send-to=${MAIL_TEST_SEND_TO:}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.mailSender=${LOGGING_LEVEL_MAILSENDER:INFO}
logging.level.com.mailSender.smtp=${LOGGING_LEVEL_SMTP:INFO}
